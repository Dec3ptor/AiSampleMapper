name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/admiring-thompson-ypq8ii]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it part way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check artifact.html is in step with index.html
        run: |
          node tools/build-artifact.mjs
          git diff --exit-code artifact.html \
            || { echo "::error::artifact.html is stale — run 'node tools/build-artifact.mjs' and commit it."; exit 1; }

      # enablement only works if the workflow token may create the Pages site.
      # On most repositories it may not, so fail with instructions rather than
      # an opaque "Resource not accessible by integration".
      - id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true

      - name: Explain how to turn Pages on
        if: steps.pages.outcome == 'failure'
        run: |
          echo "::error title=GitHub Pages is not enabled::Turn it on once at \
          Settings -> Pages -> Build and deployment -> Source: GitHub Actions, \
          then re-run this workflow. Everything else here is ready."
          exit 1

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
