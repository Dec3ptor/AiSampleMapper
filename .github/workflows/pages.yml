name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/admiring-thompson-ypq8ii]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it part way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check artifact.html is in step with index.html
        run: |
          node tools/build-artifact.mjs
          git diff --exit-code artifact.html \
            || { echo "::error::artifact.html is stale — run 'node tools/build-artifact.mjs' and commit it."; exit 1; }

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
